name: Feature Request
description: Suggest a technical improvement or new repository-specific feature
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please describe the **problem first**, then explain the proposed solution.

        Large club-wide initiatives should usually begin through the internal planning process before becoming a GitHub feature request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem currently exists?
      placeholder: Describe the problem clearly and who is affected by it.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why Is This Useful?
      description: Explain the value this feature would provide.
      placeholder: What would improve if this feature existed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you have in mind.
      placeholder: Explain how you think this feature could work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there simpler ways to solve the same problem?
      placeholder: Describe any alternative approaches you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this request affect?
      options:
        - Frontend
        - Backend
        - Database
        - Authentication / Permissions
        - Admin Dashboard
        - Events
        - Media
        - Notifications / Email
        - DevOps / Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How large do you think this change is?
      options:
        - Small improvement
        - Medium feature
        - Large feature
        - Unsure
    validations:
      required: true

  - type: textarea
    id: users
    attributes:
      label: Who Benefits?
      description: Who would benefit from this feature?
      placeholder: Example: students, admins, organizers, technical team

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Does this depend on another feature, service, or technical change?
      placeholder: Write "None" if there are no known dependencies.

  - type: textarea
    id: risks
    attributes:
      label: Risks or Concerns
      description: Are there any known security, privacy, maintenance, cost, or complexity concerns?
      placeholder: Write "None" if no risks are currently known.

  - type: textarea
    id: mockup
    attributes:
      label: Mockups / Examples
      description: Add screenshots, diagrams, examples, or references if helpful.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add anything else that may help the team evaluate the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I checked that a similar feature request does not already exist.
          required: true
        - label: I described the problem before proposing the solution.
          required: true
        - label: I understand that large club-wide initiatives may need internal planning before development.
          required: true
